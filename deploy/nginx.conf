# Served by the nginx image (see Dockerfile). Static Astro build in /usr/share/nginx/html.
# Validate locally: docker build -t site . && docker run --rm -p 8080:80 site

# Language negotiation for "/" (French by default, English if preferred).
map $http_accept_language $preferred_lang {
    default fr;
    "~^en" en;
}

map $sent_http_content_type $cache_control {
    default                   "public, max-age=0, must-revalidate";
    ~*text/html               "public, max-age=0, must-revalidate";
    ~*application/pdf         "public, max-age=86400";
    ~*image/                  "public, max-age=604800";
    ~*font/                   "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript text/javascript application/manifest+json
               image/svg+xml application/ld+json;

    add_header Cache-Control $cache_control always;
    include /etc/nginx/snippets/security-headers.conf;

    location = / {
        add_header Vary "Accept-Language" always;
        add_header Cache-Control "private, no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 302 /$preferred_lang/;
    }

    # Hashed build assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Service worker kill switch must always be revalidated.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(txt|xml|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Contact cards: text/vcard lets phones offer "add to contacts".
    location ~* \.vcf$ {
        types { }
        default_type "text/vcard; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Directories (/fr, /en/cv) get a 301 to their trailing-slash URL.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
